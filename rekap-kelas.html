<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekapitulasi NALA-CSR Kelas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    
    <!-- HEADER -->
    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-6 text-white text-center">
      <h1 class="text-xl font-extrabold">REKAPITULASI JURNAL NALA-CSR</h1>
      <p class="text-xs text-blue-200 mt-1">Laporan Penilaian Harian Kelas Nala</p>
    </div>

    <!-- 1. GERBANG AKSES TOKEN -->
    <div id="authSection" class="p-8 max-w-md mx-auto space-y-5">
      <div class="text-center">
        <div class="w-12 h-12 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center mx-auto mb-2">
          <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-900">Akses Rekapitulasi</h2>
        <p class="text-xs text-slate-500">Pilih kelas dan masukkan token akses khusus kelas Anda</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Pilih Kelas</label>
          <select id="authKelas" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:border-blue-600 outline-none">
            <option value="">-- Pilih Kelas --</option>
            <option value="X-1">X-1</option>
            <option value="X-2">X-2</option>
            <option value="XI-1">XI-1</option>
            <option value="XI-2">XI-2</option>
            <option value="XII-1">XII-1</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Token Kelas</label>
          <input type="password" id="authToken" placeholder="Masukkan Token Kelas..." class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-sm focus:border-blue-600 outline-none">
        </div>

        <button onclick="verifyToken()" id="btnAuth" class="w-full bg-blue-700 hover:bg-blue-800 text-white py-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2">
          <i data-lucide="shield-check" class="w-4 h-4"></i> Masuk Rekapitulasi
        </button>

        <p id="authError" class="text-rose-600 text-xs text-center font-semibold hidden bg-rose-50 p-2.5 rounded-xl border border-rose-200"></p>
      </div>
    </div>

    <!-- 2. DASHBOARD REKAPITULASI -->
    <div id="recapSection" class="hidden p-6 space-y-6">
      
      <!-- TOP BAR INFO KELAS & LOGOUT -->
      <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-200">
        <div>
          <span class="text-xs text-slate-500">Rekapitulasi Terbuka Untuk:</span>
          <h2 id="activeKelasDisplay" class="text-xl font-extrabold text-blue-900"></h2>
        </div>
        <button onclick="location.reload()" class="text-xs font-bold text-slate-600 hover:text-rose-600 transition flex items-center gap-1.5 bg-white px-3 py-2 rounded-lg border border-slate-300">
          <i data-lucide="lock" class="w-4 h-4"></i> Keluar
        </button>
      </div>

      <!-- FILTER RENTANG TANGGAL -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-slate-50/80 p-4 rounded-xl border border-slate-200 items-end">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Dari Tanggal</label>
          <input type="date" id="startDateInput" class="w-full bg-white border border-slate-300 rounded-lg p-2 text-xs font-semibold">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Sampai Tanggal</label>
          <input type="date" id="endDateInput" class="w-full bg-white border border-slate-300 rounded-lg p-2 text-xs font-semibold">
        </div>
        <button onclick="loadRecapData()" id="btnFilter" class="bg-blue-700 hover:bg-blue-800 text-white py-2 px-4 rounded-lg font-bold text-xs transition flex items-center justify-center gap-2">
          <i data-lucide="filter" class="w-4 h-4"></i> Tampilkan Rekap
        </button>
      </div>

      <!-- KONTEN REKAPITULASI HASIL -->
      <div id="recapContent" class="space-y-4"></div>

    </div>

  </div>

  <script>
    // MASUKKAN URL APPS SCRIPT SPREADSHEET BARU DI SINI
    const RECAP_GAS_URL = "https://script.google.com/macros/s/AKfycbz4QNvwO3iBQhF48wR4cFJHYJ9M6eGkzuC1NS8c7uZMX0Orl1zLX4cubFh4tfJAoSGTFg/exec";

    let authenticatedKelas = "";

    document.getElementById('startDateInput').value = new Date().toISOString().substring(0, 10);
    document.getElementById('endDateInput').value = new Date().toISOString().substring(0, 10);
    lucide.createIcons();

    async function sendApiRequest(data) {
      const formData = new URLSearchParams();
      formData.append("data", JSON.stringify(data));
      const res = await fetch(RECAP_GAS_URL, { method: "POST", body: formData });
      return await res.json();
    }

    async function verifyToken() {
      const kelas = document.getElementById('authKelas').value;
      const token = document.getElementById('authToken').value;
      const btn = document.getElementById('btnAuth');
      const err = document.getElementById('authError');

      if (!kelas || !token) {
        err.innerText = "Pilih kelas dan masukkan token!";
        err.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Memeriksa...`;
      lucide.createIcons();
      err.classList.add('hidden');

      try {
        const res = await sendApiRequest({ action: 'verifyToken', kelas: kelas, token: token });
        if (res.success) {
          authenticatedKelas = kelas;
          document.getElementById('activeKelasDisplay').innerText = `Kelas ${kelas}`;
          document.getElementById('authSection').classList.add('hidden');
          document.getElementById('recapSection').classList.remove('hidden');
          loadRecapData();
        } else {
          err.innerText = res.message;
          err.classList.remove('hidden');
        }
      } catch (e) {
        err.innerText = "Gagal terhubung ke Server.";
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="shield-check" class="w-4 h-4"></i> Masuk Rekapitulasi`;
        lucide.createIcons();
      }
    }

    async function loadRecapData() {
      const start = document.getElementById('startDateInput').value;
      const end = document.getElementById('endDateInput').value;
      const container = document.getElementById('recapContent');

      if (!start || !end) return;

      container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2 text-blue-600"></i> Memuat rekapitulasi data...</div>`;
      lucide.createIcons();

      try {
        const res = await sendApiRequest({ action: 'getRecapByRange', kelas: authenticatedKelas, startDate: start, endDate: end });

        if (!res.rekap || res.rekap.length === 0) {
          container.innerHTML = `<div class="p-6 bg-amber-50 border border-amber-200 rounded-xl text-center text-xs text-amber-800 font-semibold">Tidak ada data rekapitulasi pada rentang tanggal terpilih.</div>`;
          return;
        }

        // Urutkan rentang tanggal secara berurutan
        res.rekap.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

        let html = '';

        res.rekap.forEach(item => {
          item.detailJp.sort((a, b) => a.jamKe - b.jamKe);

          html += `
            <div class="border border-slate-200 rounded-xl p-4 bg-white shadow-sm space-y-3">
              <div class="flex justify-between items-center border-b pb-2">
                <div>
                  <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Tanggal</span>
                  <p class="text-sm font-extrabold text-slate-800">${item.tanggal}</p>
                </div>
                <div class="text-right">
                  <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Skor Harian</span>
                  <p class="text-lg font-black text-emerald-600">${item.totalSkorHarian} <span class="text-xs font-normal text-slate-400">Poin</span></p>
                </div>
              </div>

              <div class="space-y-2">
                <p class="text-xs font-bold text-slate-700">Rincian Pengisian Nilai oleh guru (hanya diakui 7 JP saja):</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          `;

          item.detailJp.forEach(jp => {
            html += `
              <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs flex justify-between items-center">
                <div>
                  <span class="font-bold text-blue-900">Jam Ke-${jp.jamKe}</span>
                  <p class="text-slate-600 font-medium text-[11px]">Guru: ${jp.namaGuru}</p>
                </div>
                <div class="text-right">
                  <span class="font-extrabold text-slate-800">Skor: ${jp.skor}</span>
                  ${jp.catatan ? `<p class="text-[10px] text-amber-600 italic max-w-[120px] truncate" title="${jp.catatan}">${jp.catatan}</p>` : ''}
                </div>
              </div>
            `;
          });

          html += `
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (e) {
        container.innerHTML = `<div class="p-4 bg-rose-50 border border-rose-200 rounded-xl text-center text-xs text-rose-700 font-semibold">Gagal memuat rekapitulasi data.</div>`;
      } finally {
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
